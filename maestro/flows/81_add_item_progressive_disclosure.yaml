# Flow 81 — Add Item Progressive Disclosure
# Verifies the storage-scoped add flow saves with only Name + Quantity.
appId: com.vishuddhi.stoqly
env:
  TEST_EMAIL: test@smartinventory.dev
  TEST_PASSWORD: Test@1234
---
- runFlow: 00_signin_helper.yaml
- assertVisible: "Stoqly"
- runFlow: open_test_warehouse.yaml
- tapOn:
    id: "addItemButton"
- extendedWaitUntil:
    visible: "More details"
    timeout: 10000
- assertNotVisible: "SKU (Optional)"
- tapOn:
    id: "itemNameField"
- eraseText: 80
- inputText: "Progressive Disclosure Item"
- tapOn:
    id: "currentQuantityInput"
- eraseText: 10
- inputText: "12.5"
- tapOn:
    text: "Done"
    optional: true
- hideKeyboard:
    optional: true
- tapOn:
    id: "addItemSaveButton"
- extendedWaitUntil:
    visible: "Progressive Disclosure Item"
    timeout: 15000
- assertVisible: "Progressive Disclosure Item"
