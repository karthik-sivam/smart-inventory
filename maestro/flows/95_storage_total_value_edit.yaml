# Flow 95 — Edit Storage shows Total Value (currency), not unit count headline
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- runFlow: seed_sale_test_item.yaml
- tapOn: "Storages"
- scrollUntilVisible:
    element: "Test Warehouse"
    direction: DOWN
    timeout: 15000
- swipe:
    direction: LEFT
    on: "Test Warehouse"
- tapOn: "Edit"
- assertVisible: "Edit Storage"
- scrollUntilVisible:
    element: "Total Value"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "editStorageTotalValue"
- tapOn: "Cancel"
