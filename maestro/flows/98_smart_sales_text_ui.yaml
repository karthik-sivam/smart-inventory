# Flow 98 — Smart Sales Text mode UI (no AI parse — avoids network flake)
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- tapOn: "Sales"
- tapOn:
    id: "salesEmptySmartEntryButton"
    optional: true
- tapOn:
    id: "smartSalesEntryToolbarButton"
    optional: true
- assertVisible: "Smart Sales Entry"
- tapOn:
    id: "smartSalesMode_text"
    optional: true
- tapOn: "Text"
    optional: true
- assertVisible: "Text Sales Entry"
- assertVisible:
    id: "smartSalesTextInput"
- tapOn:
    id: "smartSalesTextInput"
- inputText: "2 chips 5"
- assertVisible:
    id: "smartSalesParseButton"
- tapOn: "Cancel"
