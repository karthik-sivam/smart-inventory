# Flow 101 — Smart Sales CSV: open import, verify column mapping step (no file upload)
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- tapOn:
    text: "^Sales$"
- tapOn:
    id: "salesEmptySmartEntryButton"
    optional: true
- tapOn:
    id: "smartSalesEntryToolbarButton"
    optional: true
- assertVisible: "Smart Sales Entry"
- tapOn:
    id: "smartSalesMode_csv_excel"
    optional: true
- tapOn:
    text: "CSV / Excel"
    optional: true
- assertVisible: "Import Sales File"
- assertVisible: "Choose CSV or Excel File"
- tapOn: "Cancel"
