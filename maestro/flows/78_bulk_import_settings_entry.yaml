# Flow 78 — Bulk Import entry visible in Settings (Pro users)
# Verifies the "Import Items (CSV / Excel)" row exists under Settings → Inventory
# and that BulkImportView opens with the expected step-0 UI.
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- tapOn: "Dashboard"
- tapOn:
    id: "dashboardGearButton"
- tapOn:
    id: "gear"
- scrollUntilVisible:
    element: "Import Items (CSV / Excel)"
    direction: DOWN
    timeout: 10000
- assertVisible: "Import Items (CSV / Excel)"
- tapOn: "Import Items (CSV / Excel)"
- assertVisible:
    text: "Upgrade to Stoqly Pro"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Import Items"
    timeout: 8000
    optional: true
- assertVisible:
    text: "Import Items"
    optional: true
- assertVisible:
    text: "Default Storage"
    optional: true
- assertVisible:
    text: "Supported formats"
    optional: true
- assertVisible:
    text: "Choose File (CSV or Excel)"
    optional: true
# Cancel back to Settings
- tapOn:
    text: "Cancel"
    optional: true
- assertVisible: "Settings"
