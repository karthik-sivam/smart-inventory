# Flow 97 — Sales tab Reports sheet opens and shows summary
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- runFlow: 93_quick_sale_record.yaml
- tapOn: "Sales"
- tapOn:
    id: "salesViewReportsButton"
- assertVisible: "Reports"
- assertVisible:
    id: "reportsView"
- assertVisible: "Movements"
- tapOn: "Done"
