# Flow 91 — Smart Insights data-health nudges (M6-1)
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- tapOn: "Dashboard"
- scrollUntilVisible:
    element:
      text: "Smart Insights"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30
- assertVisible: "Smart Insights"
- assertVisible:
    text: "Missing cost prices"
    optional: true
- assertVisible:
    text: "Missing selling prices"
    optional: true
- assertVisible:
    text: "Low-stock alerts disabled"
    optional: true
