# Flow 65 — Template name required (Save disabled when empty)
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- tapOn: "Dashboard"
- tapOn:
    id: "dashboardGearButton"
- tapOn:
    id: "gear"
- scrollUntilVisible:
    element: "Item Templates"
    direction: DOWN
    timeout: 10000
- tapOn: "Item Templates"
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    id: "createTemplateButton"
    optional: true
- assertVisible:
    text: "New Template"
    optional: true
- tapOn:
    text: "Template Name"
    optional: true
- inputText: "Temp"
- assertVisible:
    text: "Save"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
