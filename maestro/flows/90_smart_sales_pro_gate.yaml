# Flow 90 — Smart Sales Entry Pro gate
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml
- tapOn: "Sales"
- tapOn:
    id: "salesEmptySmartEntryButton"
- assertVisible: "Smart Sales Entry"
- assertVisible:
    text: "PRO"
    optional: true
- tapOn:
    id: "smartSalesMode_voice"
    optional: true
- tapOn:
    text: "Voice"
    optional: true
- assertVisible:
    text: "Go Pro"
    optional: true
- assertVisible:
    text: "Upgrade"
    optional: true
