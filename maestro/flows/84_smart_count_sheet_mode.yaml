# Flow 84 — Smart Count: Sheet mode navigation
# Camera unavailable in simulator — verify Sheet Inventory UI loaded.
appId: com.vishuddhi.stoqly
env:
  TEST_EMAIL: test@smartinventory.dev
  TEST_PASSWORD: Test@1234
---
- runFlow: 00_signin_helper.yaml
- runFlow: open_test_warehouse.yaml
- tapOn:
    id: "smart-count-button"
- assertVisible: "Smart Count"
- tapOn: "Sheet Inventory"
- assertVisible: "Sheet Inventory"
- assertVisible: "Photograph Sheet"
- tapOn: "Cancel"
- assertVisible: "Smart Count"
- tapOn: "Done"
