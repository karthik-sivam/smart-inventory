# Flow 15 — Settings Screen
# Tests settings screen renders correctly and currency picker works
appId: com.vishuddhi.stoqly
---
- runFlow: 00_signin_helper.yaml

# Settings is accessed via the gear icon on the Dashboard
- tapOn: "Dashboard"
- tapOn:
    id: "dashboardGearButton"
- tapOn:
    id: "gear"
- assertVisible: "Settings"

# Subscription section — Free after isPro revert, or Pro if StoreKit/Firestore grant
- assertVisible:
    text: "Free Plan"
    optional: true
- assertVisible:
    text: "Stoqly Pro"
    optional: true
- assertVisible:
    text: "Upgrade to Pro"
    optional: true
- assertVisible:
    text: "Manage Subscription"
    optional: true

# Currency section
- assertVisible: "Currency"

# Privacy section
- assertVisible: "Privacy & Ads"

# Close settings
- tapOn: "Done"
