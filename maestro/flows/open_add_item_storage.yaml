# Open the Add Item sheet from storage detail (toolbar + or empty-state button).
appId: com.vishuddhi.stoqly
---
- tapOn:
    id: "addItemButton"
- extendedWaitUntil:
    visible: "More details"
    timeout: 10000
- tapOn:
    id: "moreDetailsButton"
- extendedWaitUntil:
    visible: "SKU (Optional)"
    timeout: 10000
